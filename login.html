<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工作紀錄手冊 - 登入</title>
    <style>
        :root {
            --primary-color: #333;
            --accent-color: #666;
            --bg-color: #f9f9f9;
            --card-bg: #ffffff;
            --error-color: #d32f2f;
            --font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--primary-color);
        }

        .login-container {
            background-color: var(--card-bg);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 1px;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--accent-color);
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background-color: #000;
        }

        .btn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .secondary-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            font-size: 0.9rem;
            margin-top: 1.5rem;
            cursor: pointer;
            text-decoration: underline;
        }

        .error-message {
            color: var(--error-color);
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #333;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            /* Safari */
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="login-container">
        <h1>工作紀錄手冊登入</h1>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">ID (使用者帳號)</label>
                <input type="text" id="username" name="username" required placeholder="請輸入您的 ID">
            </div>

            <button type="submit" class="btn" id="loginBtn">登入</button>
            <div id="loginError" class="error-message"></div>
        </form>
        <div style="display: flex; gap: 10px; margin-top: 1rem;">
            <button type="button" class="btn" style="background-color: #eee; color: #333;" onclick="guestVisit()">訪客參觀
                (Guest)</button>
            <button class="secondary-btn" id="openRegisterBtn" style="margin-top: 0;">建立新 ID</button>
        </div>
    </div>

    <!-- Register Modal -->
    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeRegisterBtn">&times;</span>
            <h2>建立新帳號</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regUsername">ID (使用者帳號)</label>
                    <input type="text" id="regUsername" name="username" required>
                </div>
                <!-- Hidden password for register too -->
                <input type="hidden" name="password" value="default">

                <div class="form-group">
                    <label for="googleSheetUrl">Google Sheet Web App URL (選填)</label>
                    <input type="text" id="googleSheetUrl" name="googleSheetUrl" placeholder="用於同步資料">
                </div>
                <button type="submit" class="btn" id="registerBtn">註冊並同步</button>
                <div id="registerError" class="error-message"></div>
                <div id="registerSuccess" style="color: green; margin-top: 1rem; display: none;">註冊成功！請登入。</div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Login Logic
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const loginError = document.getElementById('loginError');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = loginForm.username.value.trim();
            const password = "default"; // Auto-filled for ID-only login

            if (!username) return;

            // Loading State
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<div class="loader"></div> 登入中...';
            loginError.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${API_BASE}/token`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || '登入失敗');
                }

                const data = await response.json();
                localStorage.setItem('token', data.access_token);
                // Redirect to Workspaces selector
                window.location.href = '/workspaces.html';

            } catch (err) {
                console.error(err);
                // Show actual error for debugging
                const msg = err.message || err.toString();
                loginError.textContent = `登入失敗: ${msg}`;
                loginError.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登入';
            }
        });

        function guestVisit() {
            localStorage.removeItem('token');
            window.location.href = '/dashboard.html';
        }

        // Register Modal Logic
        const modal = document.getElementById('registerModal');
        const openBtn = document.getElementById('openRegisterBtn');
        const closeBtn = document.getElementById('closeRegisterBtn');
        const registerForm = document.getElementById('registerForm');
        const registerBtn = document.getElementById('registerBtn');
        const registerError = document.getElementById('registerError');
        const registerSuccess = document.getElementById('registerSuccess');

        openBtn.onclick = () => {
            modal.style.display = 'flex';
            registerForm.reset();
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';
        }
        closeBtn.onclick = () => modal.style.display = 'none';
        window.onclick = (event) => {
            if (event.target == modal) modal.style.display = 'none';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = registerForm.regUsername.value.trim();
            const password = "default";
            const googleSheetUrl = registerForm.googleSheetUrl.value.trim();

            registerBtn.disabled = true;
            registerBtn.textContent = '建立中...';
            registerError.style.display = 'none';
            registerSuccess.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('password', password);
                if (googleSheetUrl) formData.append('google_sheet_url', googleSheetUrl);

                const response = await fetch(`${API_BASE}/api/users`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.detail || '註冊失敗');
                }

                registerSuccess.style.display = 'block';
                setTimeout(() => {
                    modal.style.display = 'none';
                    // Auto fill login form
                    loginForm.username.value = username;
                }, 1500);

            } catch (err) {
                registerError.textContent = err.message;
                registerError.style.display = 'block';
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = '註冊並同步';
            }
        });
    </script>
</body>

</html>
