name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # 將 Image 名稱設為 ghcr.io/<使用者>/<Repo名稱>，這裡使用 github 變數自動填入
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        
      - name: Deploy to Fly.io
        # 需要設定 GitHub Secret: FLY_API_TOKEN
        # 您需要在 Fly.io 註冊並執行 `fly tokens create deploy -x 999999h` 取得 Token
        if: secrets.FLY_API_TOKEN != ''
        run: |
          flyctl deploy --remote-only
      
      - name: Notice
        if: secrets.FLY_API_TOKEN == ''
        run: |
          echo "::warning title=Deployment Setup Needed::Please sign up for Fly.io, creating an app, and set the FLY_API_TOKEN secret."
