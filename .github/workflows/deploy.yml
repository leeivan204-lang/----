name: Deploy to VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  # 將 Image 名稱設為 ghcr.io/<使用者>/<Repo名稱>，這裡使用 github 變數自動填入
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # 只在 main 分支部署
    
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 登入 GHCR (在伺服器上)
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # 設定專案目錄
            PROJECT_DIR="~/apps/work-log-assistant"
            mkdir -p $PROJECT_DIR
            cd $PROJECT_DIR
            
            # 下載最新 docker-compose.yml (如果沒有的話，或需要更新)
            # 這裡我們假設 docker-compose.yml 已經在伺服器上，或者我們可以用 curl 下載 raw file
            # 簡單做法：直接覆寫 docker-compose.yml 內容 (或是 repo 有被 clone 到 server)
            # 推薦：如果 server 上有 git repo，則 git pull。如果沒有，則用 scp 或 echo 寫入。
            # 為了簡單起見，我們假設 Server 上已經 clone 了 repo 資料夾
            # 如果是全自動，我們可以用 scp action 複製 docker-compose.yml 過去
            
            # 方案 B: 假設使用者已經 clone 了 repo 在 ~/apps/work-log-assistant
            # git pull origin main
            
            # 方案 C (更穩健): 直接拉取 Image 並重啟，假設 docker-compose.yml 內容不常變
            # 但既然我們有 CD，最好連 compose 變更也同步。
            
            # 這裡採用: Git Pull (需要 server 有 git auth，稍嫌麻煩)
            # 簡化方案: 讓使用者先手動 clone 一次。這裡執行 git pull。
            
            if [ ! -d ".git" ]; then
              echo "Error: Project directory is not a git repository. Please clone the repo first."
              exit 1
            fi
            
            git pull origin main
            
            # 拉取最新 Image
            image_name=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
            docker pull $image_name:latest
            
            # 重啟服務
            docker compose up -d
            
            # 清理舊 Image
            docker image prune -a -f || true
